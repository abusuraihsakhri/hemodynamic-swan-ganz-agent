name: Hemodynamic Swan Ganz Engine CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[server,test]"

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: HMAC audit-chain smoke check
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        import pytest
        assert AuditLogger.verify_integrity() is True
        print('Audit chain initialization check passed')
        "

    - name: Check Python compilation
      run: python -m compileall -q agents hemodynamic_swan_ganz_agent

    - name: Test static calculator in Node
      run: |
        node --check web/calculator.mjs
        node --test tests/web.test.mjs

    - name: Verify Python wheel build
      run: python -m pip wheel . --no-deps --wheel-dir /tmp/swan-wheels
