[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hemodynamic-swan-ganz-engine"
version = "2.0.0"
description = "SwanGanz Sentinel: Pulmonary Artery Catheter Hemodynamic & Shock Classifier"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
hemodynamic-swan-ganz-engine = "hemodynamic_swan_ganz_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/hemodynamic-swan-ganz-engine"
Repository = "https://github.com/abusuraihsakhri/hemodynamic-swan-ganz-engine.git"

[tool.pytest.ini_options]
testpaths = [".", "tests"]
python_files = ["test_*.py"]
python_classes = ["Test"]
python_functions = ["test_*"]
